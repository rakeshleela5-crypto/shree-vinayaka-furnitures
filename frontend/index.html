<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godrej Interio | Shree Vinayaka Furnitures - Showroom ERP & POS</title>
    <meta name="description" content="Godrej Interio - Shree Vinayaka Furnitures Authorised Showroom POS, ERP, Barcode Inventory, and Retail Management System." />
    <meta name="keywords" content="Godrej Interio, Shree Vinayaka Furnitures, Godrej Storwel, Slimline Almirah, Kalista Bed, Orthopedic Mattress, Godrej Security Safes" />
    
    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph for Social Sharing / Cloudflare Edge Preview -->
    <meta property="og:title" content="Godrej Interio - Shree Vinayaka Furnitures" />
    <meta property="og:description" content="Authorised Godrej Interio Showroom - Modern Steel Wardrobes, Sofas, Beds, Ortho Mattresses, Office Chairs, and Security Safes." />
    <meta property="og:type" content="website" />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#003366" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Anti-cache Meta for Zero-Downtime SPA Deployments -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- Inline Zero-Dependency App-Shell Skeleton Styles (Sub-50ms First Contentful Paint) -->
    <style>
      #app-shell-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background-color: #0b1120;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        z-index: 99999;
        overflow: hidden;
      }
      .sk-header {
        height: 52px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        flex-shrink: 0;
      }
      .sk-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sk-logo {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: linear-gradient(135deg, #d97706, #78350f);
        box-shadow: 0 2px 6px rgba(180, 83, 9, 0.35);
        flex-shrink: 0;
      }
      .sk-title {
        font-size: 13.5px;
        font-weight: 600;
        color: #f8fafc;
        letter-spacing: 0.015em;
      }
      .sk-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #38bdf8;
      }
      .sk-pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
        animation: skPulse 1.4s ease-in-out infinite;
      }
      .sk-body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .sk-sidebar {
        width: 210px;
        background: #0f172a;
        border-right: 1px solid #1e293b;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
      }
      .sk-nav-item {
        height: 36px;
        border-radius: 6px;
        background: #1e293b;
      }
      .sk-main {
        flex: 1;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #0b1120;
        overflow: hidden;
      }
      .sk-stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .sk-stat-card {
        height: 84px;
        background: #1e293b;
        border-radius: 8px;
        border: 1px solid #334155;
      }
      .sk-pos-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
        min-height: 0;
      }
      .sk-pos-area, .sk-billing-area {
        background: #1e293b;
        border-radius: 8px;
        border: 1px solid #334155;
        height: 100%;
      }
      .sk-shimmer {
        position: relative;
        overflow: hidden;
      }
      .sk-shimmer::after {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.04) 20%,
          rgba(255, 255, 255, 0.09) 60%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: skShimmer 1.8s infinite;
        content: '';
      }
      @keyframes skShimmer {
        100% {
          transform: translateX(100%);
        }
      }
      @keyframes skPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- High-Performance App Shell Skeleton (Painted <50ms, replaced on React Mount) -->
      <div id="app-shell-skeleton" aria-busy="true" aria-label="Loading Shree Vinayaka Furnitures ERP">
        <header class="sk-header">
          <div class="sk-brand">
            <div class="sk-logo"></div>
            <span class="sk-title">Shree Vinayaka Furnitures ERP — Initializing POS &amp; WMS...</span>
          </div>
          <div class="sk-status">
            <span class="sk-pulse-dot"></span>
            <span>Booting Local Cache &amp; Cloud Gateway</span>
          </div>
        </header>
        <div class="sk-body">
          <aside class="sk-sidebar">
            <div class="sk-nav-item sk-shimmer" style="width: 85%;"></div>
            <div class="sk-nav-item sk-shimmer" style="width: 100%;"></div>
            <div class="sk-nav-item sk-shimmer" style="width: 90%;"></div>
            <div class="sk-nav-item sk-shimmer" style="width: 75%;"></div>
            <div class="sk-nav-item sk-shimmer" style="width: 95%;"></div>
            <div class="sk-nav-item sk-shimmer" style="width: 80%;"></div>
          </aside>
          <main class="sk-main">
            <div class="sk-stats-grid">
              <div class="sk-stat-card sk-shimmer"></div>
              <div class="sk-stat-card sk-shimmer"></div>
              <div class="sk-stat-card sk-shimmer"></div>
              <div class="sk-stat-card sk-shimmer"></div>
            </div>
            <div class="sk-pos-grid">
              <div class="sk-pos-area sk-shimmer"></div>
              <div class="sk-billing-area sk-shimmer"></div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Immediately purge any stale Service Workers and CacheStorage
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        }).catch(function() {});
      }
    </script>
  </body>
</html>
