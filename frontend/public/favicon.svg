<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b55" />
      <stop offset="100%" stop-color="#001833" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners and gold border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Crown / Star Accent -->
  <circle cx="32" cy="16" r="4.5" fill="url(#goldGrad)" />
  
  <!-- Stylized Royal Furniture 'V' Monogram -->
  <path d="M16 24 L32 50 L48 24" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 25 L32 42 L42 25" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
